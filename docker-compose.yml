version: "3"

volumes:
  cassandra-data:
  cache-data:
  minio-data:

services:
  cassandra-db:
    image: cassandra:latest
    ports:
      - "9042:9042"
    environment:
      - CASSANDRA_CLUSTER_NAME=MyCluster
      - CASSANDRA_ENDPOINT_SNITCH=GossipingPropertyFileSnitch
      - CASSANDRA_DC=DC1
      - CASSANDRA_RACK=Rack1
      - CASSANDRA_LISTEN_ADDRESS=cassandra-db
      - CASSANDRA_BROADCAST_ADDRESS=cassandra-db
      - CASSANDRA_SEEDS=cassandra-db
    volumes:
      - cassandra-data:/var/lib/cassandra

  cache:
    image: redis:alpine
    container_name: humblebrag-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - cache-data:/data

  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data
    volumes:
      - minio-data:/data

networks:
  web_network:
    name: web_network
